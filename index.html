<!DOCTYPE html>
<html lang="it">
<head>
    <title>Due Bottoncini</title>  <!-- titolo della pagina, appare nella scheda del browser -->
    <style>
        .red-button {
            background-color: red;
            color: greenyellow;
        }

        .BottoneBlu {
            background-color: blue;
            color: white;
            border: none;
        }
    </style> <!-- il tag style è dove si scrive codice CSS -->
</head>
<body>
    <button title="questa e' una tooltip cazzo" class="red-button">
        helloooo
    </button> <!-- button -->

    <p>
        Questo e' un bottone:
        <button class="BottoneBlu">ciaooo</button>
        Ora scrivo dopo il bottone
    </p> <!-- paragraph -->

    <script src="MuoverePulsante.js"></script> <!-- pezzettino di javascript che muove il primo bottone, scritto dall'AI Agent -->
</body>
</html>
